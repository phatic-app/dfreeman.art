<extend template="base.shtml">

<title id="title" :text="$page.title"></title>

<head id="head">
</head>

<main id="main">
	<h1 :text="$page.title"></h1>
	<ul class="series-grid" :loop="$page.subpages()">
		<li>
			<a href="$loop.it.link()">
				<ctx :if="$loop.it.custom.get?('image')">
					<span class="img-wrap"><img src="$site.asset($if).link()" alt="$loop.it.title" loading="lazy"></span>
				</ctx>
				<div class="series-card-text">
					<span class="series-card-title" :text="$loop.it.title"></span>
					<span class="series-card-desc" :text="$loop.it.description"></span>
				</div>
			</a>
		</li>
	</ul>
</main>
